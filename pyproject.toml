[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-mlops"
version = "0.1.0"
description = "A reproducible self-healing MLOps reference implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "numpy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
api = ["fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1"]
dev = ["fastapi>=0.116,<1", "httpx>=0.28,<1", "pytest>=8.4,<9", "ruff>=0.16,<0.17"]
notebooks = ["matplotlib>=3.8,<4", "nbconvert>=7,<8", "ipykernel>=6,<8"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint.per-file-ignores]
# Both modules extend sys.path before importing so they work in serverless runtimes.
"src/sentinel/__init__.py" = ["E402"]
"src/sentinel/api.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["sentinel"]

[tool.vercel]
entrypoint = "src.sentinel.api:app"
